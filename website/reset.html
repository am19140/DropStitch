<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password · DropStitch</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#80ABD7">
  <link rel="icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .form { width: 100%; max-width: 380px; margin: 22px auto 0; text-align: left; display: grid; gap: 14px; }
    .form label { font-weight: 800; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-2); }
    .form input {
      width: 100%; height: 54px; margin-top: 6px; padding: 0 16px; border-radius: 16px;
      border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
      font: 600 17px Nunito, system-ui, sans-serif;
    }
    .form input:focus { outline: 2px solid var(--cobalt); outline-offset: 1px; }
    .form .button { width: 100%; margin-top: 6px; border: 0; cursor: pointer; font-family: inherit; }
    .form .button:disabled { opacity: .45; cursor: default; }
    .error { color: #B20E19; font-weight: 800; font-size: 15px; min-height: 1em; margin: 0; }
  </style>
</head>
<body>
  <header class="band page-band">
    <div class="wrap">
      <nav class="nav" aria-label="Main">
        <a class="brand" href="/"><img src="/img/head.png" alt="" width="40" height="40">dropstitch</a>
      </nav>
      <div style="height:44px"></div>
    </div>
    <svg class="wave" viewBox="0 0 390 46" preserveAspectRatio="none" aria-hidden="true" style="background:var(--paper)"><path d="M0,0 H390 V18 C330,48 270,44 205,26 C140,8 80,10 0,34 Z" fill="#80ABD7"/></svg>
  </header>

  <main class="confirm">
    <img id="art" src="/img/reading.webp" alt="Purl reading a knitting pattern" width="640" height="640">
    <h1 id="title">Choose a new password</h1>
    <p id="message">Pick something you'll remember, at least 8 characters.</p>

    <form id="form" class="form" hidden>
      <div><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div>
      <div><label for="repeat">Type it again</label><input id="repeat" type="password" autocomplete="new-password" minlength="8" required></div>
      <p id="error" class="error" role="alert"></p>
      <button id="save" class="button" type="submit">Save new password</button>
    </form>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/supabase-2.117.3.js"></script>
  <script>
    // The link in the "Reset your password" email brings the reset session in the address (#access_token=…&type=recovery).
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var linkParams = new URLSearchParams(location.hash.slice(1) + '&' + location.search.slice(1));
      var linkError = linkParams.get('error_description') || linkParams.get('error');

      function show(title, message, art) {
        $('title').textContent = title;
        $('message').textContent = message;
        if (art) $('art').src = '/img/' + art + '.webp';
        $('form').hidden = true;
      }

      if (linkError) {
        show('That link didn’t work', /expired|invalid/i.test(linkError)
          ? 'This link has expired or was already used. In DropStitch, tap “Forgot password?” to get a new one.'
          : 'Something went wrong with this link. In DropStitch, tap “Forgot password?” to try again.');
        return;
      }

      // No session storage: this page only needs the session long enough to save the new password.
      var supabase = window.supabase.createClient(window.DROPSTITCH.supabaseUrl, window.DROPSTITCH.supabaseKey, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: true },
      });

      supabase.auth.getSession().then(function (result) {
        // Clear the sign-in details from the address now that the library has read them.
        if (location.hash || location.search) history.replaceState(null, '', location.pathname);
        if (!result.data.session) {
          show('Open the link from your email', 'This page works from the “Reset your password” email. In DropStitch, tap “Forgot password?” to get one.');
          return;
        }
        $('form').hidden = false;
        $('password').focus();
      });

      $('form').addEventListener('submit', function (event) {
        event.preventDefault();
        var password = $('password').value, repeat = $('repeat').value;
        $('error').textContent = '';
        if (password.length < 8) { $('error').textContent = 'Please use at least 8 characters.'; return; }
        if (password !== repeat) { $('error').textContent = 'The two passwords don’t match.'; return; }
        $('save').disabled = true;
        $('save').textContent = 'Saving…';
        supabase.auth.updateUser({ password: password }).then(function (result) {
          if (result.error) {
            $('save').disabled = false;
            $('save').textContent = 'Save new password';
            $('error').textContent = /different from the old/i.test(result.error.message)
              ? 'Please choose a password you haven’t used before.'
              : 'Couldn’t save it: ' + result.error.message;
            return;
          }
          supabase.auth.signOut();
          show('Password changed!', 'All set. Go back to DropStitch and sign in with your new password.', 'proud');
        });
      });
    })();
  </script>
</body>
</html>
